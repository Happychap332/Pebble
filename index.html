<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pebble — plan calmly</title>
  <meta name="description" content="Pebble is a calm, minimal study planner for students: calendar, to-dos with next-day reminders, focus timer, flashcards and breathing breaks.">
  <meta name="theme-color" content="#F5F3EE">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // apply the last theme before anything paints, so the login page matches
    try { document.documentElement.dataset.theme = localStorage.getItem('pebble:theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); } catch (e) { }
  </script>
</head>
<body class="locked">
  <div class="backdrop" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#today" data-view="today">
        <img src="assets/logo.svg" alt="" width="36" height="36">
        <span>Pebble</span>
      </a>

      <nav class="nav" aria-label="Main">
        <button class="nav-btn" data-view="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg><span>Today</span></button>
        <button class="nav-btn" data-view="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendar</span></button>
        <button class="nav-btn" data-view="tasks"><svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.3 1.3L7.5 4.6M3.5 12l1.3 1.3 2.7-2.7M3.5 18l1.3 1.3 2.7-2.7"/></svg><span>To-do</span></button>
        <button class="nav-btn" data-view="study"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/></svg><span>Study</span></button>
        <button class="nav-btn" data-view="cards"><svg viewBox="0 0 24 24"><rect x="3" y="7.5" width="13.5" height="13" rx="2.5"/><path d="M7.5 4h11A2.5 2.5 0 0 1 21 6.5v10"/></svg><span><i class="long">Flashcards</i><i class="short">Cards</i></span></button>
        <button class="nav-btn" data-view="focus"><svg viewBox="0 0 24 24"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 10v3.5l2.3 2.3M9.5 2.5h5"/></svg><span>Focus</span><em class="nav-badge" id="focusBadge" hidden></em></button>
        <button class="nav-btn" data-view="insights"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span>Insights</span></button>
        <button class="nav-btn" data-view="breathe"><svg viewBox="0 0 24 24"><path d="M3 8.5h10.5a3 3 0 1 0-3-3M3 12.5h14.5a3 3 0 1 1-3 3M3 16.5h6.5"/></svg><span>Breathe</span></button>
        <button class="nav-btn" data-view="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span></button>
      </nav>

      <div class="sidebar-foot">
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg>
          <span>Theme</span>
        </button>
        <div class="who">
          <span class="who-avatar" aria-hidden="true"></span>
          <span class="who-name" id="whoName"></span>
          <button class="icon-btn" id="logoutBtn" title="Sign out" aria-label="Sign out"><svg viewBox="0 0 24 24"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 16l-4-4 4-4M6 12h10"/></svg></button>
        </div>
      </div>
    </aside>

    <main id="main" tabindex="-1">
      <div class="mobile-top">
        <img src="assets/logo.svg" alt="" width="30" height="30"><span>Pebble</span>
      </div>
      <section class="view" id="view-today"></section>
      <section class="view" id="view-calendar" hidden></section>
      <section class="view" id="view-tasks" hidden></section>
      <section class="view" id="view-study" hidden></section>
      <section class="view" id="view-insights" hidden></section>
      <section class="view" id="view-focus" hidden></section>
      <section class="view" id="view-cards" hidden></section>
      <section class="view" id="view-breathe" hidden></section>
      <section class="view" id="view-settings" hidden></section>
    </main>
  </div>

  <button class="fab" id="fab" aria-label="Add a task or event (shortcut: N)">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="modal" id="modal" aria-hidden="true"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="auth" id="auth"></div>

  <script src="js/app.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
